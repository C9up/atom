[workspace]
resolver = "2"
members = [
  "crates/atom-engine",
  "crates/atom-engine-napi",
  "crates/atom-engine-wasm",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/C9up/atom"

# Production build.
#
# The VM lives in `atom-engine` and the binding in `atom-engine-napi`: without
# LTO nothing inlines across the two and every opcode is a cross-crate call.
# `codegen-units = 1` lets LLVM see the whole loop.
#
# No `panic = "abort"`: every exported function wraps its body in
# `catch_unwind` so a panic becomes a JavaScript error (napi-rs does not do it
# for a plain `#[napi]` function), and `abort` would kill the application.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
